# ---------------------------------------------------------------------------
# immune-repertoire-pipelines -- configuration template
#
# Copy to config/config.yml and edit. config/config.yml is git-ignored, so
# cohort labels, local paths and study-specific thresholds never enter the
# repository history.
#
#   cp config/config.example.yml config/config.yml
#
# Every pipeline reads this file and nothing else: no path, sample name,
# contrast or threshold is hard-coded in pipelines/ or R/.
# ---------------------------------------------------------------------------

project:
  name: "example-study"
  # Written into the header of every output directory and figure legend file.
  description: "Worked example on simulated data"
  # Random seed. Fixed for every stochastic step (bootstraps, UMAP,
  # permutations, subsampling) so a rerun reproduces figure for figure.
  seed: 1234

paths:
  # All inputs are read from here; nothing is written inside it.
  data_dir: "data/example"
  # Every run creates a timestamped subdirectory here, so no run can
  # overwrite another.
  output_dir: "results"
  # Reference directory. See data/README.md for what to place in it:
  # IMGT germlines (readIMGT), specificity databases, etc.
  reference_dir: "reference"

# ---------------------------------------------------------------------------
# Cohort description
#
# Subject and sample labels live here only. Use whatever identifiers the
# study uses; the pipelines treat them as opaque strings and never parse
# meaning out of them beyond what the regexes below declare.
# ---------------------------------------------------------------------------
cohort:
  subjects: ["subject_01", "subject_02", "subject_03"]

  # Ordered levels for every factor. Figure panels, legends and statistical
  # contrasts all follow this order, which is the only place it is defined.
  conditions: ["baseline", "treatment_a", "treatment_b"]
  timepoints: ["t0", "t1", "t2"]

  # Optional display labels and colours. Leave empty to fall back on the
  # package's colour-blind-safe palette (see R/plotting.R).
  condition_labels:
    baseline: "Baseline"
    treatment_a: "Treatment A"
    treatment_b: "Treatment B"
  condition_colours: {}

  # How subject and condition are recovered from input file names.
  # Checked at startup: the pipelines stop with a readable error if a file
  # does not match, rather than silently producing an NA group.
  filename_pattern:
    subject: "^(subject_[0-9]+)"
    timepoint: "_(t[0-9]+)"
    condition: "_(baseline|treatment_[ab])"

# ---------------------------------------------------------------------------
# Repertoire-level parameters
# ---------------------------------------------------------------------------
repertoire:
  # Locus to analyse. "TRB" / "IGH" for bulk; single-cell pipelines handle
  # paired chains and use this as the primary chain.
  locus: "TRB"

  # Which column holds abundance. Named here and never inferred: UMI counts
  # and read counts are not interchangeable, and `duplicate_count` means
  # molecules in some assemblers' output and reads in others'. Using reads
  # where UMIs exist inflates abundance by the PCR duplication factor,
  # which differs per sample.
  #   "umi_count"       UMI-collapsed molecules (preferred)
  #   "duplicate_count" whatever the assembler put there -- check which
  abundance_column: "umi_count"

  # Clonotype definition used for every count, diversity and overlap metric.
  #   "aa"     CDR3 amino acid sequence only
  #   "nt"     CDR3 nucleotide sequence only
  #   "gene"   V and J gene calls only
  #   "strict" V gene + J gene + CDR3 nucleotide  (recommended)
  clonotype_definition: "strict"

  # Minimum abundance for a clonotype to be counted, in UMI (or reads if the
  # protocol has no UMI). This is THE consequential choice in bulk work and
  # the only place it is set.
  #
  # min_abundance: 1 applies no filter: most sensitive, least specific.
  # Raising it removes single-molecule clonotypes, which are disproportionately
  # called "de novo" because absence at baseline is what defines them.
  # Run the sweep below before fixing a value, and report it in Methods.
  min_abundance: 1
  # Values compared by the diagnostic sweep (pipelines/03, step 2).
  min_abundance_sweep: [1, 2, 3, 5]

  # Rarefaction. Repertoire richness, clone counts and clonal concentration
  # all scale with sequencing depth, so any comparison between samples of
  # unequal depth is confounded unless it is made at a common depth.
  rarefaction:
    enabled: true
    n_bootstrap: 200

  # Note on Chao1: it extrapolates unseen clonotypes from the singletons,
  # so it is only meaningful at min_abundance = 1. Above that the
  # singletons are gone by construction and the estimate collapses onto
  # observed richness; the code returns NA rather than that artefact.

# ---------------------------------------------------------------------------
# Differential clonal abundance
#
# Two independent axes, deliberately kept apart (see docs/design_notes.md):
#   - category:     descriptive, relative to the subject's own baseline
#                   (de novo / pre-existing)
#   - significance: statistical, Fisher exact test on counts with FDR control
#
# A clonotype can be de novo and not significant, or pre-existing and
# significantly expanded. Collapsing the two axes into a single
# "vaccine-induced" or "treatment-induced" label conflates a description with
# a test result, and is the single most common error in this analysis.
# ---------------------------------------------------------------------------
differential_abundance:
  # Reference sample for each subject. Every post-reference sample of that
  # subject is tested against it.
  reference_timepoint: "t0"
  fold_change_threshold: 2
  fdr_threshold: 0.05
  fdr_method: "BH"
  # Detection floor for calling a clonotype absent at baseline.
  # Keep aligned with repertoire.min_abundance unless there is a reason not
  # to: a clonotype below the floor at baseline is "not detected", not "absent".
  detection_floor: 1

# ---------------------------------------------------------------------------
# Convergence / public clonotypes
# ---------------------------------------------------------------------------
convergence:
  # A public group is a set of CDR3s that share the same V gene and whose
  # pairwise identity is at least cdr3_identity, spanning at least
  # min_subjects subjects.
  cdr3_identity: 0.75
  min_subjects: 2
  # Levenshtein distance normalised by the shorter of the two sequences.
  # Absolute distance thresholds are length-dependent and, on short CDR3s,
  # frequently yield no edges at all.
  distance_normalisation: "shorter"
  # Label permutation null: how many times subject labels are shuffled to
  # obtain the number of public groups expected by chance.
  n_permutations: 200
  # Restrict convergence analysis to mutated or class-switched sequences.
  # Unmutated naive sequences are close to germline and therefore close to
  # each other, which inflates apparent convergence.
  require_mutated_or_switched: true
  shm_threshold: 0.02

# ---------------------------------------------------------------------------
# BCR-specific parameters
# ---------------------------------------------------------------------------
bcr:
  # Clonal assignment. Either estimate the threshold from the data
  # (findThreshold on the distance-to-nearest distribution) or fix it.
  # Fixing it makes runs comparable across batches; estimating it adapts to
  # each dataset. Whichever is used must be stated in Methods.
  clone_threshold_mode: "estimate"   # "estimate" | "fixed"
  clone_threshold_fixed: 0.15
  clone_method: "nt"
  clone_linkage: "single"
  # Group clonal assignment within subject. Clones are not shared across
  # subjects by construction; convergence between subjects is assessed
  # separately (see convergence, above).
  clone_fields: ["subject_id"]

  # Single-cell: one heavy chain per cell.
  cell_resolution:
    prefer_switched_isotype: true    # IGHM/IGHD de-prioritised
    aggregate_umi: true
    # A cell with two or more heavy chains each above this UMI count is
    # called a doublet and dropped, rather than arbitrarily resolved.
    doublet_min_umi: 10

  # Somatic hypermutation.
  shm:
    regions: ["IMGT_V", "IMGT_VDJ"]
    # Minimum cells for a clone to count as expanded. Resting and
    # stimulated material are not comparable on one threshold: a
    # multi-day stimulation culture produces identical daughter cells, so
    # the cut-off that marks real expansion in resting material is met
    # trivially after stimulation.
    expansion_min_cells_resting: 2
    expansion_min_cells_stimulated: 4

  # Isotype reporting.
  # Naive and marginal-zone B cells co-transcribe IGHM and IGHD. When one
  # isotype per cell is retained, an IgM-versus-IgD split describes which
  # transcript dominated, not two populations. Report the combined unswitched
  # fraction instead.
  report_unswitched_combined: true

# ---------------------------------------------------------------------------
# Single-cell transcriptome (Seurat v5)
# ---------------------------------------------------------------------------
gex:
  # Per-sample QC. Thresholds are per sample because the distributions are:
  # a resting sample and a stimulated one do not share an upper
  # nFeature bound. "default" applies to any sample not named here.
  qc:
    default:
      min_features: 500
      max_features: 4000
      max_counts: 10000
      max_percent_mt: 5
    # Example of an override block. The key is the sample name. These
    # numbers are placeholders, not recommended values: read the per-sample
    # distributions and set each bound from them. A stimulated or
    # proliferating sample typically needs a higher upper bound than a
    # resting one, because larger cells carry more transcripts.
    SAMPLE_NAME_HERE:
      min_features: 500
      max_features: 6000
      max_counts: 30000
      max_percent_mt: 5
  mito_pattern: "^MT-"

  normalisation:
    method: "LogNormalize"
    scale_factor: 10000
    n_variable_features: 2000

  # Batch correction. Off by default: it should be a decision, not a default.
  # Turn it on only when a batch effect has been demonstrated, and say so.
  integration:
    method: "none"                   # "none" | "harmony"
    # Required when method is "harmony"; ignored otherwise.
    batch_variable: "subject_id"

  clustering:
    n_pcs: 30
    resolution: 0.5
    # Resolutions and dimensionalities swept before fixing the two above.
    sweep_n_pcs: [10, 20, 30]
    sweep_resolution: [0.1, 0.3, 0.5]

  # Flag any cluster dominated by a single subject above this fraction.
  # Cluster proportions cannot be compared between conditions when a cluster
  # is essentially one subject's cells.
  max_single_subject_fraction: 0.80

# ---------------------------------------------------------------------------
# Statistics
# ---------------------------------------------------------------------------
statistics:
  paired_test: "wilcoxon"
  # With few subjects, a paired signed-rank test cannot reach conventional
  # significance whatever the effect size (n = 3 bottoms out at p = 0.25,
  # n = 5 at p = 0.0625). The pipelines compute this bound, print it next to
  # every paired p-value, and report direction concordance across subjects
  # as the primary evidence when the bound is above the alpha level.
  report_attainable_p: true
  alpha: 0.05

output:
  formats: ["pdf", "png"]
  dpi: 300
  # Write sessionInfo() and the resolved configuration into every run
  # directory, so a figure can always be traced back to the exact parameters
  # and package versions that produced it.
  write_session_info: true
  write_resolved_config: true
